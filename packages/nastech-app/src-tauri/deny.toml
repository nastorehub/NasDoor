[graph]
targets = []

[advisories]
ignore = [

    # proc-macro-error 1.0.4 — RUSTSEC-2024-0370: unmaintained.
    # Pulled in by gtk3-macros → glib-macros → glib → Tauri. No replacement.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error pulled transitively by glib-macros/gtk3-macros; no drop-in replacement" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]
exceptions = []
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
